[package]
name = "portfolio-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["json"] }
base64 = "0.22"
chacha20poly1305 = "0.10.1"
png = "0.18"
qrcode = { version = "0.14.1", default-features = false }
totp-rs = { version = "=5.7.0", features = ["otpauth"] }
dotenvy = "0.15.7"
fs2 = "0.4.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1-rustls-tls", "hostname"] }
rand = "0.8.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util"] }
url = "2.5"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"
