  <circle class="h" cx="330.0" cy="173.2" r="25.2" />
  <g class="lanterne" transform="translate(300 136) scale(2.5000)"><path class="a" d="M7.9 9.3 12 5.8l4.1 3.5v8.4l-.9 2.6H9.2l-.4-2.6Z" /><path class="t" d="M10.3 4.4a1.7 1.7 0 0 1 3.4 0M12 4.4v1.4M7.9 9.3 12 5.8l4.1 3.5ZM8.8 9.3v8.4M15.2 9.3v8.4M12 9.3v8.4M7.4 17.7h9.2M9.2 20.3h5.6M8.8 17.7l.4 2.6M15.2 17.7l-.4 2.6" style="stroke-width:1.5" /><path class="l" d="M12 11.2c1.5 1.6 2 2.8 2 3.8a2 2 0 0 1-4 0c0-1 .5-2.2 2-3.8Z" /></g>
