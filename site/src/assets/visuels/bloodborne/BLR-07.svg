  <path class="t a" d="M60.0 57.4L61.2 60.3L64.4 60.6L62.0 62.6L62.7 65.7L60.0 64.1L57.3 65.7L58.0 62.6L55.6 60.6L58.8 60.3Z" />
  <path class="t l" d="M68.0 33.6L69.7 37.7L74.1 38.0L70.7 40.9L71.8 45.2L68.0 42.9L64.2 45.2L65.3 40.9L61.9 38.0L66.3 37.7Z" />
