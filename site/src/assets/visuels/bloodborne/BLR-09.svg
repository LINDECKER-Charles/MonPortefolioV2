<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" class="v-blr">
  <title>Une étoile entre par une flèche dans une pile de trois fiches et ressort rangée dans sa case ; une lanterne au pied de la pile</title>
  <!--
    BLR-09, dessiné à la main pour la direction « Lanterne » : trait constant en
    currentColor, aplat et lumière par jetons, la lanterne du logo (cage à
    quatre montants, anneau, flamme en goutte) seule source de lumière.
    BLR-09 : la couche « L’API ». Série BLR-08 à BLR-10.
    Seul, il suit le color-scheme de son conteneur (svg:root et
    prefers-color-scheme) ; inséré dans la page, il prend les jetons.
  -->
  <style>
    svg:root { color: #141312; --surface: #fbfaf7; --trait: #7b7368; --laiton: #7a4f10; --lanterne: #f0b24a; }
    @media (prefers-color-scheme: dark) { svg:root { color: #e4e7ee; --surface: #1a1e29; --trait: #687083; --laiton: #f0b24a; } }
    .v-blr .t { fill: none; stroke: currentColor; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .v-blr .f { fill: none; stroke: var(--trait); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .v-blr .a { fill: var(--surface); }
    .v-blr .l { fill: var(--laiton); }
    .v-blr .h { fill: var(--lanterne); opacity: 0.32; }
  </style>
