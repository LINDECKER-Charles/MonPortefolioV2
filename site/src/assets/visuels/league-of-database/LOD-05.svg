<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" class="v-lod">
  <title>Une feuille de brouillon froissée puis dépliée, couverte de traits, un crayon posé en travers</title>
  <!--
    LOD-05, dessiné à la main : grille de 48, trait de 1,75 en currentColor.
    Jalon 1 : le premier jet. Sans lumière : seul le jalon atteint (LOD-12) la porte.
    Couleurs par jetons quand le dessin est inséré dans la page ; seul, il
    suit le color-scheme de son conteneur (svg:root et prefers-color-scheme).
  -->
  <style>
    svg:root { color: #141312; --surface: #fbfaf7; --trait: #7b7368; --laiton: #7a4f10; --lanterne: #f0b24a; }
    @media (prefers-color-scheme: dark) { svg:root { color: #e4e7ee; --surface: #1a1e29; --trait: #687083; --laiton: #f0b24a; } }
    .v-lod .t { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .v-lod .f { fill: none; stroke: var(--trait); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
    .v-lod .p { stroke-dasharray: 2 2.4; }
    .v-lod .a { fill: var(--surface); }
    .v-lod .l { fill: var(--laiton); }
    .v-lod .h { fill: var(--lanterne); opacity: 0.32; }
  </style>
  <path class="t a" d="M9 8.5l9.5 1.2 9-1.6 11 1.4-1 10.5 1.2 9.5-1.4 10.5-10-1-9.5 1.4-9.2-1.2 1-10.2L8.4 19Z" />
  <path class="f" d="M18.5 9.7l-1.2 30M27.5 8.1l1.4 31.5M8.4 19l30.8.9M9.6 29.5l29-.8" />
  <path class="t" d="M12.5 14c2-1.4 3.6 1 5.4-.2M21 14.6c2.4-1.6 4.2.8 6.4-.4M12.8 24c2.2-1.2 3.6.8 5.6-.4M21.4 24.4c2.6-1.4 4.6 1 7-.4M12.6 34c1.8-1 3.2.6 4.8-.2M30.5 14.2c1.6-.8 3 .4 4.4-.2" />
  <path class="t a" d="M14 41.5 37.5 18l3.5 3.5L17.5 45l-5 1Z" />
  <path class="t" d="M14 41.5l3.5 3.5M34.5 21l3.5 3.5" />
</svg>
