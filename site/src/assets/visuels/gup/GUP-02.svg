<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 96" width="576" height="96" class="v-gup">
  <title>Six pictogrammes des choix d’ingénierie de gup : une cloison étanche, des arguments séparés, un seul colis tombé, un réveil sans fil, un seul système actif, un œil devant deux pastilles contrastées</title>
  <!--
    GUP-02, dessiné à la main : six cases de 96 × 96, un accent de lumière au plus
    par picto. Chaque picto est aussi un <symbol id="GUP-02-…"> (cloison, arguments,
    colis, reveil, systemes, lisible) ; la bande les reprend en clair pour rester
    lisible en <img> (une <use> n’hérite pas des règles de classe du fichier).
    Trait constant en currentColor, aplat et lumière par jetons ; seul, le
    dessin suit le color-scheme de son conteneur (svg:root et
    prefers-color-scheme) ; inséré dans la page, il prend les jetons.
  -->
  <style>
    svg:root { color: #141312; --surface: #fbfaf7; --trait: #7b7368; --laiton: #7a4f10; --lanterne: #f0b24a; }
    @media (prefers-color-scheme: dark) { svg:root { color: #e4e7ee; --surface: #1a1e29; --trait: #687083; --laiton: #f0b24a; } }
    .v-gup .t { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .v-gup .f { fill: none; stroke: var(--trait); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .v-gup .a { fill: var(--surface); }
    .v-gup .l { fill: var(--laiton); }
    .v-gup .h { fill: var(--lanterne); opacity: 0.32; }
  </style>
