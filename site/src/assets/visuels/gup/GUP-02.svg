<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 96" width="576" height="96" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Les choix d’ingénierie de gup, en six pictogrammes</title>

  <!-- 1. Une cloison étanche : le compartiment fissuré n’inonde pas l’autre. -->
  <g class="GUP-02-cloison">
    <rect x="12" y="26" width="72" height="46" rx="4"/>
    <path d="M48 20v58" stroke-width="4"/>
    <path d="M20 26l7 9-5 8 8 9-5 8 4 12" stroke-width="1.6"/>
    <path d="M18 64q4-4 8 0t8 0" stroke-width="1.4"/>
    <circle class="accent" cx="66" cy="49" r="7" fill="#f0b24a"/>
  </g>

  <!-- 2. Des arguments en blocs séparés, sans coquille autour. -->
  <g class="GUP-02-arguments" transform="translate(96 0)">
    <rect class="accent" x="10" y="28" width="24" height="15" rx="3" fill="#f0b24a"/>
    <rect x="39" y="28" width="28" height="15" rx="3"/>
    <rect x="72" y="28" width="14" height="15" rx="3"/>
    <rect x="10" y="53" width="34" height="15" rx="3"/>
    <rect x="49" y="53" width="20" height="15" rx="3"/>
    <path d="M16 35.5h12M45 35.5h16M78 35.5h2M16 60.5h22M55 60.5h8" stroke-width="1.4"/>
  </g>

  <!-- 3. Quatre colis sur leur tapis : un seul tombe, les autres continuent. -->
  <g class="GUP-02-colis" transform="translate(192 0)">
    <path d="M6 62h36M56 62h34"/>
    <circle cx="12" cy="67" r="2.5" stroke-width="1.4"/>
    <circle cx="36" cy="67" r="2.5" stroke-width="1.4"/>
    <circle cx="62" cy="67" r="2.5" stroke-width="1.4"/>
    <circle cx="84" cy="67" r="2.5" stroke-width="1.4"/>
    <rect x="9" y="47" width="13" height="13" rx="1.5"/>
    <rect x="26" y="47" width="13" height="13" rx="1.5"/>
    <rect x="59" y="47" width="13" height="13" rx="1.5"/>
    <rect class="accent" x="75" y="47" width="13" height="13" rx="1.5" fill="#f0b24a"/>
    <rect x="43" y="74" width="13" height="13" rx="1.5" transform="rotate(24 49.5 80.5)"/>
    <path d="M45 66l2 5M52 66l-1 5" stroke-width="1.2" stroke-dasharray="1.5 2.5"/>
    <path d="M60 34h24m-5-4 5 4-5 4" stroke-width="1.6"/>
  </g>

  <!-- 4. Un réveil qui sonne puis se tait, sans fil vers rien. -->
  <g class="GUP-02-reveil" transform="translate(288 0)">
    <circle cx="48" cy="52" r="22"/>
    <path d="M30 31a9 9 0 0 1 12-6M66 31a9 9 0 0 0-12-6"/>
    <path d="M36 72l-5 7M60 72l5 7"/>
    <path d="M48 38v14l9 6"/>
    <circle class="accent" cx="48" cy="52" r="3.2" fill="#f0b24a"/>
    <path d="M18 44q-4 8 0 16M12 40q-6 12 0 24" stroke-width="1.6"/>
    <path d="M78 44q4 8 0 16" stroke-width="1.4" stroke-dasharray="2 3"/>
  </g>

  <!-- 5. Trois ordinateurs : un seul voit ses outils, les deux autres grisés. -->
  <g class="GUP-02-systemes" transform="translate(384 0)">
    <rect class="accent" x="6" y="34" width="24" height="17" rx="2" fill="#f0b24a"/>
    <path d="M18 51v8M12 60h12"/>
    <rect x="36" y="34" width="24" height="17" rx="2"/>
    <path d="M37.5 45.5L41.5 49.5M37.5 41.5L45.5 49.5M37.5 37.5L49.5 49.5M39.5 35.5L53.5 49.5M43.5 35.5L57.5 49.5M47.5 35.5L58.5 46.5M51.5 35.5L58.5 42.5M55.5 35.5L58.5 38.5" stroke-width="1" opacity=".75"/>
    <path d="M48 51v8M42 60h12"/>
    <rect x="66" y="34" width="24" height="17" rx="2"/>
    <path d="M67.5 45.5L71.5 49.5M67.5 41.5L75.5 49.5M67.5 37.5L79.5 49.5M69.5 35.5L83.5 49.5M73.5 35.5L87.5 49.5M77.5 35.5L88.5 46.5M81.5 35.5L88.5 42.5M85.5 35.5L88.5 38.5" stroke-width="1" opacity=".75"/>
    <path d="M78 51v8M72 60h12"/>
  </g>

  <!-- 6. Un œil devant deux pastilles contrastées. -->
  <g class="GUP-02-lisible" transform="translate(480 0)">
    <circle cx="70" cy="24" r="9" fill="currentColor"/>
    <circle cx="82" cy="36" r="9" fill="none"/>
    <path d="M12 54q30-30 60 0q-30 30-60 0z"/>
    <circle class="accent" cx="42" cy="54" r="10" fill="#f0b24a"/>
    <circle cx="42" cy="54" r="4" fill="currentColor"/>
  </g>
</svg>
