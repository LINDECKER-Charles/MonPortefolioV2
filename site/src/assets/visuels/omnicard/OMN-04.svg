<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" class="v-omn">
  <title>Deux fenêtres de navigateur envoient leur action à un serveur dessiné comme une table d’arbitre, éclairée par une lanterne, qui renvoie à chacune l’état de la partie</title>
  <!--
    OMN-04, dessiné à la main : dans chaque fenêtre, la main adverse en dos de
    cartes et la main du joueur en faces génériques (cadre, losange, pastille de
    coût vide). Flèches pleines : l’action jouée ; pointillées : l’état renvoyé.
    Les intitulés des trois étapes restent en HTML sous le dessin.
    Trait constant en currentColor, aplat et lumière par jetons ; seul, le
    dessin suit le color-scheme de son conteneur (svg:root et
    prefers-color-scheme) ; inséré dans la page, il prend les jetons.
  -->
  <style>
    svg:root { color: #141312; --surface: #fbfaf7; --trait: #7b7368; --laiton: #7a4f10; --lanterne: #f0b24a; }
    @media (prefers-color-scheme: dark) { svg:root { color: #e4e7ee; --surface: #1a1e29; --trait: #687083; --laiton: #f0b24a; } }
    .v-omn .t { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .v-omn .f { fill: none; stroke: var(--trait); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .v-omn .a { fill: var(--surface); }
    .v-omn .l { fill: var(--laiton); }
    .v-omn .h { fill: var(--lanterne); opacity: 0.32; }
  </style>
