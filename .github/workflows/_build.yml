name: _build

# Reutilisable : construire l'image du site et la publier sur GHCR, etiquetee par
# le SHA declencheur (immuable) et par une etiquette mobile (`staging` par
# defaut). Responsabilite unique : produire l'artefact candidat. Utilise le
# GITHUB_TOKEN automatique, aucun secret supplementaire.

on:
  workflow_call:
    inputs:
      ref:
        description: Ref git a construire (ex. la branche test apres fusion).
        required: true
        type: string
      moving_tag:
        description: Etiquette mobile posee a cote de l'etiquette SHA immuable.
        required: false
        type: string
        default: staging

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Prefixe d'image (proprietaire en minuscules)
        # GHCR refuse une majuscule dans un nom d'image, et le proprietaire du
        # depot en contient. `${VAR,,}` est une expansion bash, d'ou le shell.
        run: echo "IMG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monportefoliov2" >> "$GITHUB_ENV"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Connexion a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction et publication
        uses: docker/build-push-action@v7
        with:
          # Le contexte est le dossier de l'application, pas la racine : la
          # documentation, les maquettes et l'orchestration n'ont aucun role
          # dans la compilation et ne doivent donc pas pouvoir invalider le cache.
          context: site
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMG }}:${{ github.sha }}
            ${{ env.IMG }}:${{ inputs.moving_tag }}
