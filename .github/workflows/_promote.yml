name: _promote

# Reutilisable : promouvoir une image DEJA construite en lui ajoutant des
# etiquettes, sans la reconstruire. C'est ce qui garantit que la production sert
# exactement l'artefact qui a ete valide en test — un rebuild sur main, meme sur
# le meme code, produirait un binaire different (dependances resolues plus tard,
# horodatages, cache).
#
# `docker buildx imagetools create` recopie le manifeste cote registre : rien
# n'est telecharge, rien n'est reconstruit.

on:
  workflow_call:
    inputs:
      source_tag:
        description: Etiquette existante a promouvoir (ex. staging).
        required: true
        type: string
      target_tags:
        description: Etiquettes a poser, separees par des espaces (ex. "prod latest").
        required: true
        type: string

permissions:
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Connexion a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promotion ${{ inputs.source_tag }} -> ${{ inputs.target_tags }}
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAGS: ${{ inputs.target_tags }}
        run: |
          set -euo pipefail
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monportefoliov2"
          images=("${prefix}" "${prefix}-backend")
          sources=()
          revision=""

          # Echec explicite plutot qu'une erreur de registre obscure : au tout
          # premier passage sur main, l'etiquette source n'existe pas encore
          # parce qu'aucun deploiement de test n'a eu lieu.
          for img in "${images[@]}"; do
            if ! digest="$(docker buildx imagetools inspect "${img}:${SOURCE_TAG}" --format '{{.Manifest.Digest}}')"; then
              echo "L'image ${img}:${SOURCE_TAG} n'existe pas. Passer d'abord par dev." >&2
              exit 1
            fi
            source="${img}@${digest}"
            sha="$(docker buildx imagetools inspect "$source" --format '{{json .Image}}' \
              | jq -r '[.. | objects | .config?.Labels?["org.opencontainers.image.revision"] // empty] | unique | if length == 1 then .[0] else "" end')"
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]] || { [ -n "$revision" ] && [ "$sha" != "$revision" ]; }; then
              echo "Les images web/backend ne portent pas la meme revision valide. Rejouer le build dev." >&2
              exit 1
            fi
            revision="$sha"
            sources+=("$source")
          done

          for i in "${!images[@]}"; do
            img="${images[$i]}"
            args=()
            for tag in ${TARGET_TAGS}; do
              args+=(--tag "${img}:${tag}")
            done
            docker buildx imagetools create "${args[@]}" "${sources[$i]}"
            echo "Promue : ${sources[$i]} -> ${TARGET_TAGS} (revision ${revision})"
          done
