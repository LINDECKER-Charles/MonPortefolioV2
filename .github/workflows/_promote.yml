name: _promote

# Reutilisable : promouvoir une image DEJA construite en lui ajoutant des
# etiquettes, sans la reconstruire. C'est ce qui garantit que la production sert
# exactement l'artefact qui a ete valide en test — un rebuild sur main, meme sur
# le meme code, produirait un binaire different (dependances resolues plus tard,
# horodatages, cache).
#
# `docker buildx imagetools create` recopie le manifeste cote registre : rien
# n'est telecharge, rien n'est reconstruit.

on:
  workflow_call:
    inputs:
      source_tag:
        description: Etiquette existante a promouvoir (ex. staging).
        required: true
        type: string
      target_tags:
        description: Etiquettes a poser, separees par des espaces (ex. "prod latest").
        required: true
        type: string

permissions:
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Connexion a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promotion ${{ inputs.source_tag }} -> ${{ inputs.target_tags }}
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAGS: ${{ inputs.target_tags }}
        run: |
          set -euo pipefail
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/monportefoliov2"

          # Echec explicite plutot qu'une erreur de registre obscure : au tout
          # premier passage sur main, l'etiquette source n'existe pas encore
          # parce qu'aucun deploiement de test n'a eu lieu.
          if ! docker buildx imagetools inspect "${img}:${SOURCE_TAG}" >/dev/null 2>&1; then
            echo "L'image ${img}:${SOURCE_TAG} n'existe pas." >&2
            echo "Passer d'abord par la branche dev : c'est elle qui construit et deploie en test." >&2
            exit 1
          fi

          args=""
          for tag in ${TARGET_TAGS}; do
            args="${args} --tag ${img}:${tag}"
          done
          # shellcheck disable=SC2086  # $args est une liste d'options, volontairement non citee
          docker buildx imagetools create ${args} "${img}:${SOURCE_TAG}"

          echo "Promue : ${img}:${SOURCE_TAG} -> ${TARGET_TAGS}"
