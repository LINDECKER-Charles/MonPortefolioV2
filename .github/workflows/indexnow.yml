name: IndexNow

# Chaque nuit, signale aux moteurs d'IndexNow (Bing, Yandex...) les articles du
# blog publies ou retouches depuis la veille : ils partent du backoffice, sans
# deploiement, donc sans le job indexnow de ci.yml. Les pages, elles, sont
# signalees a chaque mise en production. Script et cle : scripts/indexnow.mjs.
#
# A la main : `gh workflow run indexnow.yml` signale tout le sitemap, pages
# comprises ; `-f depuis=AAAA-MM-JJ` se limite a ce qui date de ce jour ou apres.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      depuis:
        description: Jour AAAA-MM-JJ (vide = tout le sitemap)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  signaler:
    name: Signaler les adresses modifiees
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: IndexNow
        env:
          DEPUIS: ${{ inputs.depuis }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            node scripts/indexnow.mjs --blog --depuis "$(date -u -d yesterday +%F)"
          elif [ -n "${DEPUIS}" ]; then
            node scripts/indexnow.mjs --depuis "${DEPUIS}"
          else
            node scripts/indexnow.mjs
          fi
